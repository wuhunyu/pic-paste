name: Fast core regression
on:
  push:
  pull_request:
  workflow_dispatch:
concurrency:
  group: core-${{ github.event_name }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Check source format
        run: cargo fmt --all -- --check
      - name: Test platform-independent crates
        run: cargo test -p shot-core -p shot-image -p shot-scroll -p shot-ocr-protocol --locked
      - name: Strict core lints
        run: cargo clippy -p shot-core -p shot-image -p shot-scroll -p shot-ocr-protocol --all-targets --locked -- -D warnings
