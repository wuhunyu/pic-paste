name: Rust CI
# Build pull requests once, and run on push only for main. Cancel superseded
# commits on a branch so only its latest state consumes the macOS runner.
concurrency:
  group: rust-ci-${{ github.event_name }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Check source format
        run: cargo fmt --all -- --check
      - name: Test platform-independent crates
        run: cargo test -p shot-core -p shot-image -p shot-scroll -p shot-ocr-protocol --locked
      - name: Strict core lints
        run: cargo clippy -p shot-core -p shot-image -p shot-scroll -p shot-ocr-protocol --all-targets --locked -- -D warnings
  rust:
    needs: core
    runs-on: macos-26
    env:
      MACOSX_DEPLOYMENT_TARGET: '14.0'
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Apple build SDK
        run: xcodebuild -version && xcrun --show-sdk-version
      - name: Compile offline Apple Vision OCR helper
        run: |
          mkdir -p target/release
          swiftc -O -target arm64-apple-macos14.0 \
            -framework Vision -framework CoreGraphics -framework Foundation \
            -framework CryptoKit packaging/macos/PicPasteOCR.swift \
            -o target/release/PicPasteOCR
      - name: Verify Vision OCR helper binary IPC
        run: python3 scripts/check_ocr_helper.py target/release/PicPasteOCR
      - name: Benchmark tooling regression tests
        run: python3 -m unittest discover -s tests -p 'test_*.py'
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Test opt-in native NSPanel WGPU probe (no GUI)
        run: cargo test -p shot-macos --features native-panel-probe --bin ns-panel-probe --locked
      - name: Test workspace
        run: cargo test --workspace --locked
      - name: Lint workspace
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Build macOS development binary
        run: cargo build --release -p shot-macos --locked
      - name: Assemble Lite development app
        run: PICPASTE_VARIANT=Lite bash scripts/package-macos.sh
      - name: Assemble Full development app
        run: PICPASTE_VARIANT=Full bash scripts/package-macos.sh
      - name: Validate offline OCR Add-on and build independent dev archive
        run: |
          bash -n scripts/manage-ocr-addon.sh
          bash -n scripts/package-ocr-addon.sh
          bash scripts/package-ocr-addon.sh
          codesign --verify --strict dist/OCR-AddOn/PicPasteOCR
          test "$(dist/OCR-AddOn/PicPasteOCR --addon-info)" = "PICPASTE-OCR-ADDON/1 SHOC/1"
          bash scripts/manage-ocr-addon.sh status dist/Lite/PicPaste.app
          # Ad-hoc apps and Add-ons have no Developer Team ID: never trust them.
          if bash scripts/manage-ocr-addon.sh install dist/Lite/PicPaste.app dist/OCR-AddOn/PicPasteOCR; then
            echo "ERROR: ad-hoc helper was accepted as a trusted external Add-on" >&2
            exit 1
          fi
          test ! -e "$HOME/Library/Application Support/PicPaste/AddOns/OCR/PicPasteOCR"
          bash scripts/manage-ocr-addon.sh uninstall
      - name: Upload unsigned development package
        uses: actions/upload-artifact@v4
        with:
          name: picpaste-macos-dev-${{ runner.arch }}
          path: |
            dist/PicPaste-macos-*-UNSIGNED-DEV.zip
            dist/PicPaste-macos-*-UNSIGNED-DEV.zip.sha256
            dist/PicPaste-OCR-AddOn-macos-*-UNSIGNED-DEV.zip
            dist/PicPaste-OCR-AddOn-macos-*-UNSIGNED-DEV.zip.sha256
          if-no-files-found: error
