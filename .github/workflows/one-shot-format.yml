name: One-shot Rust formatting
on:
  push:
    paths:
      - .github/workflows/one-shot-format.yml
permissions:
  contents: write
jobs:
  format-once:
    if: github.ref == 'refs/heads/feat/annotation-pins-scroll-20261026'
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Canonical formatting of the feature branch
        run: |
          cargo fmt --all
          git add crates apps
          if ! git diff --cached --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'style: apply rustfmt to scroll and annotation work'
            git push origin HEAD:feat/annotation-pins-scroll-20261026
          fi
