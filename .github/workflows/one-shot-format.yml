name: Canonicalize OCR and long scroll sources
on:
  push:
    paths:
      - .github/workflows/one-shot-format.yml
permissions:
  contents: write
jobs:
  canonical:
    if: github.ref == 'refs/heads/feat/annotation-pins-scroll-20261026'
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Refresh tracked lockfile and canonical Rust formatting
        run: |
          cargo generate-lockfile
          cargo fmt --all
          git add Cargo.lock crates apps
          if ! git diff --cached --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'chore: refresh Cargo.lock and canonical OCR/scroll formatting'
            git push origin HEAD:feat/annotation-pins-scroll-20261026
          fi
